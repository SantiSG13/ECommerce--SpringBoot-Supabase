<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Listado de Productos</title>

    <!-- Hoja de estilos estática centralizada -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>
    <!-- Botón cerrar sesión fijo en esquina superior derecha -->
    <form th:action="@{/logout}" method="post" style="margin: 0;">
        <button type="submit" class="btn-logout-fijo">&#x2192; Cerrar Sesión</button>
    </form>

    <div class="contenedor-principal">

        <!-- Encabezado de la página -->
        <div class="encabezado-seccion">
            <h1 class="titulo-pagina" th:text="${titulo}">Listado de Productos</h1>
            <p class="subtitulo-pagina">Gestión e inventario de productos del sistema</p>
        </div>

        <!-- Atributos del modelo (Badges) -->
        <ul class="lista-atributos">
            <li class="insignia">ID</li>
            <li class="insignia">Nombre</li>
            <li class="insignia">Precio</li>
            <li class="insignia">Stock</li>
            <li class="insignia">Categoría</li>
            <li class="insignia">Descripción</li>
        </ul>

        <!-- Botones de navegación y acción -->
        <div class="barra-acciones">
            <a th:href="@{/Cliente/listar}" class="btn btn-secundario">&larr; Ver Clientes</a>
            <a th:href="@{/Producto/formulario}" class="btn btn-principal">+ Crear Producto</a>
        </div>

        <div class="linea-separadora"></div>

        <!-- Lista de Productos en Tarjetas -->
        <div>
            <div th:each="producto : ${productos}" class="tarjeta-registro">
                
                <!-- Cabecera de la tarjeta -->
                <div class="tarjeta-cabecera">
                    <h2 class="tarjeta-titulo" th:text="${producto.nombre}"></h2>
                    
                    <div class="tarjeta-acciones">
                        <span class="insignia" th:text="${'ID #' + producto.id}"></span>
                        <a th:href="@{/Producto/formulario/} + ${producto.id}" class="btn-editar">Editar</a>
                        <a th:href="@{/Producto/eliminar/} + ${producto.id}" onclick="return confirm('¿Seguro que deseas eliminar este producto?');" class="btn-eliminar">Eliminar</a>
                    </div>
                </div>

                <!-- Rejilla de información -->
                <div class="rejilla-datos">
                    <div class="bloque-dato">
                        <span class="etiqueta-dato">Categoría</span>
                        <p class="valor-dato" th:text="${producto.categoria}"></p>
                    </div>

                    <div class="bloque-dato">
                        <span class="etiqueta-dato">Precio</span>
                        <p class="valor-dato" th:text="${'$' + #numbers.formatDecimal(producto.precio, 1, 'POINT', 2, 'COMMA')}"></p>
                    </div>

                    <div class="bloque-dato">
                        <span class="etiqueta-dato">Stock Disponible</span>
                        <p class="valor-dato" th:text="${producto.stock + ' unidades'}"></p>
                    </div>

                    <div class="bloque-dato campo-ancho-completo">
                        <span class="etiqueta-dato">Descripción</span>
                        <p class="valor-dato" th:text="${producto.descripcion != null && !producto.descripcion.isEmpty() ? producto.descripcion : 'Sin descripción'}"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pie de página -->
        <p class="nota-pie">Sistema de Inventario de Productos &bull; Spring Boot & Thymeleaf</p>
    </div>
</body>

</html>
