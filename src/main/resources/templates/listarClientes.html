<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Listado de Clientes</title>

    <!-- Hoja de estilos estática centralizada -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>
    <!-- Botón cerrar sesión fijo en esquina superior derecha -->
    <form th:action="@{/logout}" method="post" style="margin: 0;">
        <button type="submit" class="btn-logout-fijo">&#x2192; Cerrar Sesión</button>
    </form>

    <div class="contenedor-principal">

        <!-- Encabezado de la página -->
        <div class="encabezado-seccion">
            <h1 class="titulo-pagina" th:text="${titulo}">Listado de Clientes</h1>
            <p class="subtitulo-pagina">Gestión de usuarios y registros del sistema</p>
        </div>

        <!-- Atributos del modelo (Badges) -->
        <ul class="lista-atributos">
            <li class="insignia">ID</li>
            <li class="insignia">Nombre</li>
            <li class="insignia">Apellido</li>
            <li class="insignia">Email</li>
            <li class="insignia">Fecha de Creación</li>
        </ul>

        <!-- Botones de navegación y acción -->
        <div class="barra-acciones">
            <a th:href="@{/Producto/listar}" class="btn btn-secundario">Ver Productos &rarr;</a>
            <a th:href="@{/Cliente/formulario}" class="btn btn-principal">+ Crear Cliente</a>
        </div>

        <div class="linea-separadora"></div>

        <!-- Lista de Clientes en Tarjetas -->
        <div>
            <div th:each="cliente : ${clientes}" class="tarjeta-registro">
                
                <!-- Cabecera de la tarjeta -->
                <div class="tarjeta-cabecera">
                    <h2 class="tarjeta-titulo" th:text="${cliente.nombre + ' ' + cliente.apellido}"></h2>
                    
                    <div class="tarjeta-acciones">
                        <span class="insignia" th:text="${'ID #' + cliente.id}"></span>
                        <a th:href="@{/Cliente/formulario/} + ${cliente.id}" class="btn-editar">Editar</a>
                        <a th:href="@{/Cliente/eliminar/} + ${cliente.id}" onclick="return confirm('¿Seguro que deseas eliminar este cliente?');" class="btn-eliminar">Eliminar</a>
                    </div>
                </div>

                <!-- Rejilla de información -->
                <div class="rejilla-datos">
                    <div class="bloque-dato">
                        <span class="etiqueta-dato">Nombre Completo</span>
                        <p class="valor-dato" th:text="${cliente.nombre + ' ' + cliente.apellido}"></p>
                    </div>

                    <div class="bloque-dato">
                        <span class="etiqueta-dato">Correo Electrónico</span>
                        <p class="valor-dato" th:text="${cliente.email}"></p>
                    </div>

                    <div class="bloque-dato">
                        <span class="etiqueta-dato">Fecha de Registro</span>
                        <p class="valor-dato" th:text="${#dates.format(cliente.createAt, 'dd/MM/yyyy HH:mm')}"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pie de página -->
        <p class="nota-pie">Sistema de Consulta de Clientes &bull; Spring Boot & Thymeleaf</p>
    </div>
</body>

</html>
