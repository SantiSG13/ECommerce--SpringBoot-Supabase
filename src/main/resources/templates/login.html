<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <div class="contenedor-formulario-padre">
        <div class="caja-formulario">

            <div class="encabezado-formulario">
                <h1 class="titulo-pagina titulo-centrado">Iniciar Sesión</h1>
                <p class="subtitulo-centrado">Accede al sistema de gestión</p>
            </div>

            <div th:if="${error}" class="alerta-error" th:text="${error}"></div>
            <div th:if="${success}" class="alerta-exito" th:text="${success}"></div>

            <form th:action="@{/login}" method="post">
                <div class="grupo-input">
                    <label for="username" class="etiqueta-input">Usuario</label>
                    <input type="text" id="username" name="username"
                           class="campo-texto" placeholder="Ingresa tu usuario" required autofocus>
                </div>
                <div class="grupo-input">
                    <label for="password" class="etiqueta-input">Contraseña</label>
                    <input type="password" id="password" name="password"
                           class="campo-texto" placeholder="Ingresa tu contraseña" required>
                </div>
                <button type="submit" class="btn btn-principal btn-bloque">Entrar</button>
            </form>

            <p class="nota-pie">Sistema de Gestión &bull; Spring Boot & Thymeleaf</p>

            <div class="enlace-pie">
                <a th:href="@{/registro}">¿No tienes cuenta? <span>Regístrate</span></a>
            </div>
        </div>
    </div>
</body>
</html>
